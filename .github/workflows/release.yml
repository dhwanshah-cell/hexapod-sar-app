name: Build and release

# Every push to main builds the app and publishes it as a GitHub release.
# The app checks the latest release when it opens and offers to update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: |
          CODE=$((1000 + ${{ github.run_number }}))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          scripts/build.sh "$CODE" "0.2.${{ github.run_number }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/hexapod-sar.apk "hexapod-sar-v$CODE.apk"
          git log -1 --format=%B > notes.txt
          gh release create "v$CODE" "hexapod-sar-v$CODE.apk" \
            --title "Hexapod SAR v$CODE" --notes-file notes.txt --latest
